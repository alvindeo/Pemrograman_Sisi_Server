<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik e-LMS</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            color: #111827;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            margin: 10px 0 5px;
            font-size: 2rem;
            color: #2563eb;
        }

        .card p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .chart {
            background-color: white;
            margin-top: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 30px;
        }

        canvas {
            width: 100%;
            height: 300px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>📊 Statistik e-LMS</h1>
        <p>Ringkasan aktivitas pengguna dan konten pembelajaran</p>
    </header>

    <main>
        <section class="cards">
            <div class="card">
                <h2>120</h2>
                <p>Total Pengguna</p>
            </div>
            <div class="card">
                <h2>34</h2>
                <p>Kursus Aktif</p>
            </div>
            <div class="card">
                <h2>285</h2>
                <p>Materi Tersedia</p>
            </div>
            <div class="card">
                <h2>1,042</h2>
                <p>Komentar Dikirim</p>
            </div>
        </section>

        <section class="chart">
            <h3 style="text-align:center;">Aktivitas Belajar Bulanan</h3>
            <canvas id="chartCanvas"></canvas>
        </section>
    </main>

    <footer>
        © 2025 e-LMS | Dikembangkan oleh Tim RPL
    </footer>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt'],
                datasets: [{
                    label: 'Aktivitas Belajar',
                    data: [40, 55, 60, 75, 90, 80, 95, 100, 85, 120],
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37,99,235,0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
